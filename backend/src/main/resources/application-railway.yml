spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:${POSTGRES_HOST:localhost}}:${PGPORT:${POSTGRES_PORT:5432}}/${PGDATABASE:${POSTGRES_DB:postgres}}
    username: ${PGUSER:${POSTGRES_USER:postgres}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_TIMEOUT:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  member-auth:
    expose-otp: ${MEMBER_AUTH_EXPOSE_OTP:false}
    otp-ttl-minutes: ${MEMBER_AUTH_OTP_TTL_MINUTES:10}
    email:
      enabled: ${MEMBER_AUTH_EMAIL_ENABLED:false}
      from: ${MEMBER_AUTH_EMAIL_FROM:posthumanlabnetwork@gmail.com}
      subject: ${MEMBER_AUTH_EMAIL_SUBJECT:Your Posthuman Lab Network verification code}
  newsletter:
    email:
      enabled: ${NEWSLETTER_EMAIL_ENABLED:true}
      brevo-api-key: ${NEWSLETTER_BREVO_API_KEY:${BREVO_API_KEY:}}
      brevo-api-url: ${NEWSLETTER_BREVO_API_URL:${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}}
      sender-name: ${NEWSLETTER_EMAIL_FROM_NAME:Posthuman Lab Network}
      reply-to: ${NEWSLETTER_EMAIL_REPLY_TO:posthumanlabnetwork@gmail.com}
      public-base-url: ${PUBLIC_SITE_URL:https://posthumanlabnetwork.online}
      from:
        updates: ${NEWSLETTER_EMAIL_FROM_UPDATES:posthumanlabnetwork+updates@gmail.com}
        blog: ${NEWSLETTER_EMAIL_FROM_BLOG:posthumanlabnetwork+blog@gmail.com}
        events: ${NEWSLETTER_EMAIL_FROM_EVENTS:posthumanlabnetwork+events@gmail.com}
        media: ${NEWSLETTER_EMAIL_FROM_MEDIA:posthumanlabnetwork+media@gmail.com}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:https://posthumanlabnetwork.online}
      - ${FRONTEND_WWW_ORIGIN:https://www.posthumanlabnetwork.online}
    allowed-origin-patterns: []
