server:
  port: ${PORT:8080}

spring:
  application:
    name: posthuman-lab-network
  
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/posthuman_db};DB_CLOSE_DELAY=-1
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:PosthumanLabNetworkDevEnvSigningKey2026Minimum32BytesSecure!}
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    verify-tokens: ${GOOGLE_VERIFY_TOKENS:false}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  media:
    storage:
      upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
      max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:52428800}
      allowed-extensions:
        - .jpg
        - .jpeg
        - .png
        - .webp
        - .gif
        - .mp4
        - .webm
        - .mp3
        - .wav
        - .pdf
