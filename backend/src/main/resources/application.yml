server:
  port: ${PORT:8080}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:1024}
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript

spring:
  application:
    name: posthuman-lab-network
  
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/posthuman_db};DB_CLOSE_DELAY=-1
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:true}
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:PosthumanLabNetworkDevEnvSigningKey2026Minimum32BytesSecure!}
    expiration-ms: 86400000
  member-auth:
    expose-otp: ${MEMBER_AUTH_EXPOSE_OTP:true}
    otp-ttl-minutes: ${MEMBER_AUTH_OTP_TTL_MINUTES:10}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  media:
    storage:
      upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
      max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:52428800}
      allowed-extensions:
        - .jpg
        - .jpeg
        - .png
        - .webp
        - .gif
        - .mp4
        - .webm
        - .mp3
        - .wav
        - .pdf
